# pytest -q        run tests
# ruff check .     lint
# ruff format .    format

[project]
name = "customer-segmentation"
version = "1.0.0"
description = "Customer segmentation and campaign targeting: K-Means segments, an XGBoost response model with SHAP, measured lift, and an optional LLM layer."
requires-python = ">=3.11"
license = "MIT"
# Runtime dependencies. Vercel installs from here; requirements.txt pins the same versions for pip users.
dependencies = [
    "fastapi==0.162.6",
    "uvicorn[standard]==0.54.0",
    "pydantic==2.14.3",
    "pydantic-settings==2.16.3",
    "pandas==3.1.1",
    "numpy==2.5.4",
    "scikit-learn==1.9.1",
    "joblib==1.6.0",
    "openpyxl==3.1.5",
    "python-multipart==0.0.33",
    "google-genai==3.3.0",
    # CPU-only build on Linux servers: the standard Linux wheel bundles large GPU libraries
    "xgboost==3.4.1; sys_platform != 'linux'",
    "xgboost-cpu==3.4.1; sys_platform == 'linux'",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
source = ["customer_segmentation"]
omit = ["customer_segmentation/api/main.py"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = [".venv", "frontend", "data", "artifacts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "N"]
ignore = [
    "B008",  # FastAPI Depends() in default arguments is the intended pattern
    "N803",  # X, y as argument names follow scikit-learn convention
    "N806",
    "E501",
    "N818",  # exception names read better without an Error suffix (SegmentNotFound)
]

[tool.ruff.lint.isort]
known-first-party = ["customer_segmentation", "tests"]

[tool.vercel]
entrypoint = "customer_segmentation.api.main:app"

[tool.vercel.scripts]
# Build the web app into frontend/dist (served by the API at /), then drop node_modules to keep the function small
build = "cd frontend && npm ci && npm run build && rm -rf node_modules"
